spring:
  application:
    name: catalogo-virtual
  datasource:
    # Valores por defecto iguales a docker-compose.yml; se pueden sobrescribir con variables de entorno
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalogo}
    username: ${DB_USER:catalogo}
    password: ${DB_PASSWORD:catalogo}
  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo maneja Flyway, JPA solo valida
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
