# PostgreSQL para desarrollo local. Credenciales SOLO de desarrollo.
services:
  postgres:
    image: postgres:16
    container_name: catalogo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catalogo}
      POSTGRES_USER: ${POSTGRES_USER:-catalogo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalogo}
    ports:
      - "5432:5432"
    volumes:
      - catalogo-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catalogo} -d ${POSTGRES_DB:-catalogo}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  catalogo-datos:
